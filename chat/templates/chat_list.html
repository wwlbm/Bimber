{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h3 class="fw-bold mb-4" style="color: #2d2d2d;">Chats</h3>
    
    <div class="list-group shadow-sm" style="border-radius: 20px; overflow: hidden;">
        {% for user in chat_users %}
            <a href="{% url 'chat:room' user.id %}" class="list-group-item list-group-item-action border-0 p-3 mb-1">
                <div class="d-flex align-items-center">
                    <div class="position-relative">
                        <img src="{{ user.photo.url }}" class="rounded-circle" style="width: 60px; height: 60px; object-fit: cover;">
                        </div>
                    <div class="ms-3 flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0 fw-bold">{{ user.username }}</h6>
                        </div>
                        <p class="mb-0 text-muted small text-truncate" style="max-width: 200px;">
                            Click here to continue the conversation
                        </p>
                    </div>
                    <i class="bi bi-chevron-right text-muted"></i>
                </div>
            </a>
        {% empty %}
            <div class="text-center p-5 bg-white">
                <i class="bi bi-chat-dots" style="font-size: 3rem; color: #dee2e6;"></i>
                <p class="text-muted mt-3">You dont have any chats</p>
            </div>
        {% endfor %}
    </div>
</div>

<style>
    .list-group-item-action:hover {
        background-color: #f8f9fa !important;
    }
</style>
{% endblock %}
