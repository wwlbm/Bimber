{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <a href="{% url 'inbox' %}" class="btn btn-link text-muted mb-3 p-0" style="text-decoration: none;">
                <i class="bi bi-arrow-left"></i> Back to Inbox
            </a>

            <div class="card shadow-lg border-0" style="border-radius: 25px; overflow: hidden;">
                <div style="height: 500px; width: 100%; background: #eee;">
                    {% if person.photo %}
                        <img src="{{ person.photo.url }}" style="width: 100%; height: 100%; object-fit: cover;">
                    {% else %}
                        <div class="h-100 d-flex align-items-center justify-content-center bg-secondary text-white">
                            <i class="bi bi-person" style="font-size: 5rem;"></i>
                        </div>
                    {% endif %}
                </div>

                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h1 class="fw-bold mb-0">{{ person.username }}, {{ person.age }}</h1>
                            <p class="text-muted"><i class="bi bi-geo-alt-fill"></i> {{ person.city|default:"Unknown Location" }}</p>
                        </div>
                        <span class="badge rounded-pill px-3 py-2" style="background: rgba(253, 38, 125, 0.1); color: #fd267d;">
                            {{ person.gender }}
                        </span>
                    </div>

                    <hr class="my-4" style="opacity: 0.1;">

                    <h5 class="fw-bold">About</h5>
                    <p class="text-secondary leading-relaxed">
                        {{ person.bio|default:"No bio yet..." }}
                    </p>

                    <div class="d-grid gap-3 mt-5">
                        <a href="{% url 'rate_user' person.id 'like' %}" 
                           class="btn btn-lg text-white shadow-sm" 
                           style="background: linear-gradient(45deg, #fd267d, #ff7854); border: none; border-radius: 15px; font-weight: 700;">
                            <i class="bi bi-heart-fill me-2"></i> Like Back
                        </a>

                        <a href="{% url 'chat:room' person.id %}" class="btn text-white w-100 rounded-pill" style="background: linear-gradient(45deg, #fd267d, #ff7854); font-weight: bold;">
                            <i class="bi bi-chat-heart-fill"></i> Chat
                        </a>
                        
                        <a href="{% url 'inbox' %}" class="btn btn-light btn-lg border-0" style="border-radius: 15px; background: #f8f9fa;">
                            Not now
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
